<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>L'Artisan — UML Database Diagram</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#fff;font-family:'Inter',sans-serif;overflow:hidden;}
  #toolbar{position:fixed;top:16px;right:16px;z-index:10;display:flex;gap:8px;}
  #toolbar button{padding:8px 18px;border:1.5px solid #d1d5db;border-radius:6px;
    background:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    color:#374151;cursor:pointer;transition:all .15s;}
  #toolbar button:hover{background:#f3f4f6;border-color:#9ca3af;}
  #title{position:fixed;top:16px;left:16px;z-index:10;font-size:15px;font-weight:700;color:#111;}
  #hint{position:fixed;bottom:12px;left:16px;z-index:10;font-size:11px;color:#9ca3af;}
  #canvas{width:100vw;height:100vh;}
  /* settings panel */
  #settings{position:fixed;top:56px;right:16px;z-index:10;background:#fff;border:1px solid #d1d5db;
    border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.1);padding:16px 18px;width:240px;
    font-family:'Inter',sans-serif;display:none;}
  #settings.open{display:block;}
  #settings h4{font-size:12px;font-weight:700;color:#111;margin:0 0 12px;text-transform:uppercase;letter-spacing:.5px;}
  #settings .ctrl{margin-bottom:10px;}
  #settings .ctrl label{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:#555;margin-bottom:3px;}
  #settings .ctrl label span{color:#6d28d9;font-family:'JetBrains Mono',monospace;}
  #settings input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:#e5e7eb;border-radius:2px;outline:none;}
  #settings input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#6d28d9;cursor:pointer;}
  #settings .sep{border:none;border-top:1px solid #e5e7eb;margin:10px 0;}
  /* context menu */
  #ctxmenu,#tblmenu{display:none;position:fixed;z-index:100;background:#fff;border:1px solid #d1d5db;
    border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:4px 0;font-size:13px;font-family:'Inter',sans-serif;}
  #ctxmenu div,#tblmenu div{padding:7px 18px;cursor:pointer;color:#111;}
  #ctxmenu div:hover,#tblmenu div:hover{background:#f3f4f6;}
  #ctxmenu div.danger,#tblmenu div.danger{color:#dc2626;}
  #ctxmenu div.danger:hover,#tblmenu div.danger:hover{background:#fef2f2;}
  /* modal */
  #modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.3);align-items:center;justify-content:center;}
  #modal{background:#fff;border-radius:10px;padding:24px 28px;box-shadow:0 8px 32px rgba(0,0,0,.18);min-width:320px;font-family:'Inter',sans-serif;}
  #modal h3{margin:0 0 16px;font-size:15px;font-weight:700;color:#111;}
  #modal label{display:block;font-size:12px;font-weight:600;color:#555;margin:10px 0 4px;}
  #modal input{width:100%;padding:7px 10px;border:1.5px solid #d1d5db;border-radius:5px;font-size:13px;
    font-family:'JetBrains Mono',monospace;outline:none;}
  #modal input:focus{border-color:#6d28d9;}
  #modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
  #modal .btns button{padding:7px 16px;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;border:1.5px solid #d1d5db;background:#fff;color:#374151;}
  #modal .btns button.primary{background:#6d28d9;color:#fff;border-color:#6d28d9;}
  #modal .btns button.primary:hover{background:#5b21b6;}
  #modal .btns button:hover{background:#f3f4f6;}
</style>
</head>
<body>
<div id="toolbar"><button onclick="toggleSettings()">⚙ Tailles</button><button onclick="exportSVG()">📄 SVG</button><button onclick="exportPNG()">📥 PNG</button></div>
<div id="settings">
  <h4>Relations</h4>
  <div class="ctrl"><label>Nom relation <span id="v-rel">9.5</span></label><input type="range" id="s-rel" min="4" max="40" step="0.5" value="9.5"></div>
  <div class="ctrl"><label>Cardinalité <span id="v-card">10</span></label><input type="range" id="s-card" min="4" max="40" step="0.5" value="10"></div>
  <hr class="sep">
  <h4>Tables</h4>
  <div class="ctrl"><label>En-tête table <span id="v-hdr">13</span></label><input type="range" id="s-hdr" min="4" max="40" step="0.5" value="13"></div>
  <div class="ctrl"><label>Contenu table <span id="v-col">11</span></label><input type="range" id="s-col" min="4" max="40" step="0.5" value="11"></div>
  <div class="ctrl"><label>Type colonne <span id="v-typ">10</span></label><input type="range" id="s-typ" min="4" max="40" step="0.5" value="10"></div>
  <hr class="sep">
  <h4>Dimensions</h4>
  <div class="ctrl"><label>Largeur table <span id="v-w">250</span>px</label><input type="range" id="s-w" min="100" max="800" step="5" value="250"></div>
  <div class="ctrl"><label>Hauteur ligne <span id="v-rh">20</span>px</label><input type="range" id="s-rh" min="10" max="100" step="1" value="20"></div>
  <div class="ctrl"><label>Hauteur en-tête <span id="v-hh">28</span>px</label><input type="range" id="s-hh" min="10" max="100" step="1" value="28"></div>
</div>
<div id="hint">Scroll = zoom · Drag = pan · Drag table = move · Right-click = menu · Double-click = edit name/content</div>
<div id="ctxmenu"></div>
<div id="tblmenu"><div id="tbl-rename">✎ Renommer la table</div><div class="danger" id="tbl-delete">✕ Supprimer cette table</div></div>
<div id="modal-overlay"><div id="modal"><h3>Modifier la relation</h3><label>Cardinalité côté source</label><input id="m-from" /><label>Cardinalité côté cible</label><input id="m-to" /><label>Nom de la relation</label><input id="m-label" /><div class="btns"><button onclick="closeModal()">Annuler</button><button class="primary" onclick="saveModal()">Enregistrer</button></div></div></div>
<svg id="canvas"></svg>
<script>
const svg=document.getElementById('canvas'),NS='http://www.w3.org/2000/svg';

/* ── size settings ── */
let SZ={rel:9.5, card:10, hdr:13, col:11, typ:10};
function toggleSettings(){document.getElementById('settings').classList.toggle('open');}
['rel','card','hdr','col','typ'].forEach(k=>{
  const slider=document.getElementById('s-'+k), val=document.getElementById('v-'+k);
  slider.addEventListener('input',()=>{SZ[k]=parseFloat(slider.value);val.textContent=slider.value;render();});
});

/* ── layout constants ── */
const PAD_X=10,R=5;
let COL_W=250, ROW_H=20, HDR_H=28;
(()=>{
  const sw=document.getElementById('s-w'),vw=document.getElementById('v-w');
  sw.addEventListener('input',()=>{COL_W=parseInt(sw.value);vw.textContent=sw.value;render();});
  const srh=document.getElementById('s-rh'),vrh=document.getElementById('v-rh');
  srh.addEventListener('input',()=>{ROW_H=parseInt(srh.value);vrh.textContent=srh.value;render();});
  const shh=document.getElementById('s-hh'),vhh=document.getElementById('v-hh');
  shh.addEventListener('input',()=>{HDR_H=parseInt(shh.value);vhh.textContent=shh.value;render();});
})();

const tables=[
  {name:'utilisateurs',x:50,y:280,cols:[
    {n:'id',t:'BIGINT',pk:1},{n:'name',t:'VARCHAR'},{n:'email',t:'VARCHAR UQ'},
    {n:'password',t:'VARCHAR'},{n:'pfp',t:'VARCHAR NULL'},{n:'telephone',t:'VARCHAR(20) NULL'},
    {n:'display_phone',t:'BOOL'},{n:'ville_utilisateur',t:'VARCHAR(100)'},
    {n:'statut_compte',t:'VARCHAR'},{n:'role',t:'VARCHAR'},
    {n:'last_seen_at',t:'TIMESTAMP NULL'},{n:'email_verified_at',t:'TIMESTAMP NULL'},
    {n:'timestamps',t:''}]},
  {name:'categories',x:500,y:20,cols:[
    {n:'id',t:'BIGINT',pk:1},{n:'nom',t:'VARCHAR(100) UQ'},{n:'timestamps',t:''}]},
  {name:'produits',x:500,y:200,cols:[
    {n:'id',t:'BIGINT',pk:1},{n:'vendeur_id',t:'FK → utilisateurs',fk:1},
    {n:'categorie_id',t:'FK → categories NULL',fk:1},{n:'titre',t:'VARCHAR'},
    {n:'slug',t:'VARCHAR UQ'},{n:'description',t:'TEXT NULL'},{n:'telephone_visible',t:'BOOL'},
    {n:'prix',t:'DECIMAL(12,2)'},{n:'ville_produit',t:'VARCHAR(100)'},
    {n:'images',t:'JSON NULL'},{n:'etat_produit',t:'VARCHAR'},{n:'etat_moderation',t:'VARCHAR'},
    {n:'sponsor_status',t:'VARCHAR'},{n:'sponsored_until',t:'DATETIME NULL'},
    {n:'timestamps',t:''}]},
  {name:'favoris',x:120,y:640,cols:[
    {n:'utilisateur_id',t:'PK FK → utilisateurs',pk:1,fk:1},
    {n:'produit_id',t:'PK FK → produits',pk:1,fk:1},{n:'timestamps',t:''}]},
  {name:'signalements',x:500,y:600,cols:[
    {n:'id',t:'BIGINT',pk:1},{n:'produit_id',t:'FK → produits NULL',fk:1},
    {n:'produit_nom',t:'VARCHAR NULL'},{n:'utilisateur_id',t:'FK → utilisateurs',fk:1},
    {n:'type_signalement',t:'VARCHAR'},{n:'details',t:'TEXT NULL'},
    {n:'est_traite',t:'BOOL'},{n:'timestamps',t:''}]},
  {name:'conversations',x:950,y:20,cols:[
    {n:'id',t:'BIGINT',pk:1},{n:'produit_id',t:'FK → produits',fk:1},
    {n:'acheteur_id',t:'FK → utilisateurs',fk:1},{n:'last_message_at',t:'TIMESTAMP NULL'},
    {n:'timestamps',t:''}]},
  {name:'messages',x:950,y:280,cols:[
    {n:'id',t:'BIGINT',pk:1},{n:'conversation_id',t:'FK → conversations',fk:1},
    {n:'expediteur_id',t:'FK → utilisateurs',fk:1},{n:'contenu',t:'TEXT'},
    {n:'est_lu',t:'BOOL'},{n:'timestamps',t:''}]},
  {name:'utilisateurs_bloques',x:50,y:60,cols:[
    {n:'id',t:'BIGINT',pk:1},{n:'blocker_id',t:'FK → utilisateurs',fk:1},
    {n:'blocked_id',t:'FK → utilisateurs',fk:1},{n:'timestamps',t:''}]},
  {name:'villes',x:950,y:530,cols:[
    {n:'id',t:'BIGINT',pk:1},{n:'nom',t:'VARCHAR UQ'},{n:'timestamps',t:''}]},
  {name:'parametres_site',x:950,y:680,cols:[
    {n:'id',t:'BIGINT',pk:1},{n:'timestamps',t:''}]}
];

const rels=[
  {from:'produits',to:'utilisateurs',label:'est vendu par',fromCard:'∞',toCard:'1'},
  {from:'produits',to:'categories',label:'appartient à',fromCard:'∞',toCard:'0.1'},
  {from:'favoris',to:'utilisateurs',label:'ajoute',fromCard:'∞',toCard:'1'},
  {from:'favoris',to:'produits',label:'référence',fromCard:'∞',toCard:'1'},
  {from:'signalements',to:'produits',label:'signale',fromCard:'∞',toCard:'0.1'},
  {from:'signalements',to:'utilisateurs',label:'créé par',fromCard:'∞',toCard:'1'},
  {from:'conversations',to:'produits',label:'concerne',fromCard:'∞',toCard:'1'},
  {from:'conversations',to:'utilisateurs',label:'initiée par',fromCard:'∞',toCard:'1'},
  {from:'messages',to:'conversations',label:'appartient à',fromCard:'∞',toCard:'1'},
  {from:'messages',to:'utilisateurs',label:'envoyé par',fromCard:'∞',toCard:'1'},
  {from:'utilisateurs_bloques',to:'utilisateurs',label:'bloque',fromCard:'∞',toCard:'1'},
];

let panX=0,panY=0,scale=1,dragging=null,dragOX,dragOY,panning=false,panSX,panSY;
const tm={};

function el(tag,attrs,par){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);
  if(par)par.appendChild(e);
  return e;
}
function tblH(t){return t.cols.length*ROW_H+HDR_H+6;}

function activeTables(){return tables.filter(t=>!t.hidden);}
function activeRels(){return rels.map((r,i)=>({...r,ri:i})).filter(r=>!r.hidden&&!tableHidden(r.from)&&!tableHidden(r.to));}
function tableHidden(name){const t=tables.find(t=>t.name===name);return t&&t.hidden;}

/* ── Determine which side of table faces the other table ── */
function bestSide(fromT,toT){
  const fx=fromT.x+COL_W/2, fy=fromT.y+fromT.h/2;
  const tx=toT.x+COL_W/2,  ty=toT.y+toT.h/2;
  const dx=tx-fx, dy=ty-fy;
  if(Math.abs(dx)>=Math.abs(dy)) return dx>0?'r':'l';
  return dy>0?'b':'t';
}

/* ── Compute distributed port positions per table per side ── */
function computePorts(){
  const active=activeRels();
  // Gather all connections per table per side
  const sideConns={}; // tableName -> {l:[],r:[],t:[],b:[]}
  activeTables().forEach(t=>{sideConns[t.name]={l:[],r:[],t:[],b:[]};});

  active.forEach(r=>{
    const ft=tm[r.from], tt=tm[r.to];
    if(!ft||!tt)return;
    const sideFrom=bestSide(ft,tt);
    const sideTo=bestSide(tt,ft);
    sideConns[r.from][sideFrom].push({ri:r.ri,end:'from',other:r.to});
    sideConns[r.to][sideTo].push({ri:r.ri,end:'to',other:r.from});
  });

  // Sort connections on each side by the position of the other table (to avoid crossings)
  for(const tname in sideConns){
    const t=tm[tname];
    for(const side of ['l','r','t','b']){
      const arr=sideConns[tname][side];
      arr.sort((a,b)=>{
        const oa=tm[a.other], ob=tm[b.other];
        if(side==='l'||side==='r'){
          return (oa.y+oa.h/2)-(ob.y+ob.h/2);
        } else {
          return (oa.x+COL_W/2)-(ob.x+COL_W/2);
        }
      });
    }
  }

  // Assign port positions
  const ports={}; // ri -> {from:{x,y,side}, to:{x,y,side}}
  rels.forEach((_,ri)=>{ports[ri]={};});

  for(const tname in sideConns){
    const t=tm[tname];
    for(const side of ['l','r','t','b']){
      const arr=sideConns[tname][side];
      const n=arr.length;
      if(!n)continue;
      arr.forEach((conn,i)=>{
        let px,py;
        const frac=(i+1)/(n+1);
        if(side==='l'){
          px=t.x; py=t.y+t.h*frac;
        } else if(side==='r'){
          px=t.x+COL_W; py=t.y+t.h*frac;
        } else if(side==='t'){
          px=t.x+COL_W*frac; py=t.y;
        } else {
          px=t.x+COL_W*frac; py=t.y+t.h;
        }
        ports[conn.ri][conn.end]={x:px,y:py,side};
      });
    }
  }
  return ports;
}

function drawTable(t,par){
  if(t.hidden)return;
  const g=el('g',{'data-name':t.name,transform:`translate(${t.x},${t.y})`},par);
  const h=t.h;
  el('rect',{x:0,y:0,width:COL_W,height:h,rx:R,fill:'#fff',stroke:'#222','stroke-width':1.4},g);
  el('rect',{x:0,y:0,width:COL_W,height:HDR_H,rx:R,fill:'#222'},g);
  el('rect',{x:0,y:HDR_H-R,width:COL_W,height:R,fill:'#222'},g);
  const hdrText=el('text',{x:COL_W/2,y:HDR_H/2,fill:'#fff','font-size':SZ.hdr,'font-weight':'700',
    'text-anchor':'middle','dominant-baseline':'central','font-family':'JetBrains Mono',style:'cursor:pointer'},g);
  hdrText.textContent=t.name;
  hdrText.addEventListener('dblclick',e=>{e.stopPropagation();editTableName(t);});
  el('line',{x1:0,y1:HDR_H,x2:COL_W,y2:HDR_H,stroke:'#222','stroke-width':1},g);
  t.cols.forEach((c,i)=>{
    const y=HDR_H+i*ROW_H+ROW_H/2;
    const prefix=c.pk?(c.fk?'PK FK ':'PK '):(c.fk?'FK ':'');
    const color=c.pk?'#b45309':c.fk?'#2563eb':'#111';
    const colText=el('text',{x:PAD_X,y,fill:color,'font-size':SZ.col,'font-family':'JetBrains Mono','dominant-baseline':'central',style:'cursor:pointer'},g);
    colText.textContent=prefix+c.n;
    colText.addEventListener('dblclick',e=>{e.stopPropagation();editColumn(t,i);});
    if(c.t){
      const typeText=el('text',{x:COL_W-PAD_X,y,fill:'#6b7280','font-size':SZ.typ,'text-anchor':'end',
        'dominant-baseline':'central','font-family':'JetBrains Mono',style:'cursor:pointer'},g);
      typeText.textContent=c.t;
      typeText.addEventListener('dblclick',e=>{e.stopPropagation();editColumnType(t,i);});
    }
    if(i<t.cols.length-1)
      el('line',{x1:0,y1:HDR_H+(i+1)*ROW_H,x2:COL_W,y2:HDR_H+(i+1)*ROW_H,
        stroke:'#e5e7eb','stroke-width':.5},g);
  });
  g.style.cursor='grab';
  g.addEventListener('mousedown',e=>{
    e.stopPropagation();
    dragging=t.name;
    dragOX=e.clientX/scale-t.x-panX/scale;
    dragOY=e.clientY/scale-t.y-panY/scale;
  });
  g.addEventListener('contextmenu',e=>{
    e.preventDefault();e.stopPropagation();
    showTblMenu(e.clientX,e.clientY,t.name);
  });
}

function drawRels(par,ports){
  activeRels().forEach(r=>{
    const ri=r.ri;
    const pf=ports[ri]?.from, pt=ports[ri]?.to;
    if(!pf||!pt)return;
    const x1=pf.x,y1=pf.y,x2=pt.x,y2=pt.y;
    const g=el('g',{'data-ri':ri},par);

    /* Orthogonal path */
    let path;
    if((pf.side==='l'||pf.side==='r')&&(pt.side==='l'||pt.side==='r')){
      const mx=(x1+x2)/2;
      path=`M${x1},${y1} L${mx},${y1} L${mx},${y2} L${x2},${y2}`;
    } else if((pf.side==='t'||pf.side==='b')&&(pt.side==='t'||pt.side==='b')){
      const my=(y1+y2)/2;
      path=`M${x1},${y1} L${x1},${my} L${x2},${my} L${x2},${y2}`;
    } else {
      if(pf.side==='l'||pf.side==='r'){
        path=`M${x1},${y1} L${x2},${y1} L${x2},${y2}`;
      } else {
        path=`M${x1},${y1} L${x1},${y2} L${x2},${y2}`;
      }
    }
    /* invisible fat hit-area */
    el('path',{d:path,fill:'none',stroke:'transparent','stroke-width':12,style:'cursor:pointer'},g);
    /* visible line */
    const visLine=el('path',{d:path,fill:'none',stroke:'#555','stroke-width':1.2,style:'pointer-events:none'},g);

    /* hover highlight */
    g.addEventListener('mouseenter',()=>visLine.setAttribute('stroke','#6d28d9'));
    g.addEventListener('mouseleave',()=>visLine.setAttribute('stroke','#555'));

    /* right-click → context menu */
    g.addEventListener('contextmenu',e=>{
      e.preventDefault();e.stopPropagation();
      showCtxMenu(e.clientX,e.clientY,ri);
    });

    /* Diamond at "to" end */
    const ds=4;
    if(pt.side==='l') el('polygon',{points:`${x2},${y2} ${x2-ds},${y2-ds} ${x2-2*ds},${y2} ${x2-ds},${y2+ds}`,fill:'#555',style:'pointer-events:none'},g);
    else if(pt.side==='r') el('polygon',{points:`${x2},${y2} ${x2+ds},${y2-ds} ${x2+2*ds},${y2} ${x2+ds},${y2+ds}`,fill:'#555',style:'pointer-events:none'},g);
    else if(pt.side==='t') el('polygon',{points:`${x2},${y2} ${x2-ds},${y2-ds} ${x2},${y2-2*ds} ${x2+ds},${y2-ds}`,fill:'#555',style:'pointer-events:none'},g);
    else el('polygon',{points:`${x2},${y2} ${x2-ds},${y2+ds} ${x2},${y2+2*ds} ${x2+ds},${y2+ds}`,fill:'#555',style:'pointer-events:none'},g);

    /* Label */
    let lx,ly,angle=0;
    if((pf.side==='l'||pf.side==='r')&&(pt.side==='l'||pt.side==='r')){
      const mx=(x1+x2)/2;
      lx=mx; ly=(y1+y2)/2; angle=90;
    } else if((pf.side==='t'||pf.side==='b')&&(pt.side==='t'||pt.side==='b')){
      const my=(y1+y2)/2;
      lx=(x1+x2)/2; ly=my; angle=0;
    } else {
      if(pf.side==='l'||pf.side==='r'){
        lx=(x1+x2)/2; ly=y1; angle=0;
      } else {
        lx=x1; ly=(y1+y2)/2; angle=90;
      }
    }
    const labelOffset=10;
    const lxOff=angle===90?lx-labelOffset:lx;
    const lyOff=angle===0?ly-8:ly;
    el('text',{x:lxOff,y:lyOff,fill:'#6d28d9','font-size':SZ.rel,'font-weight':'600',
      'text-anchor':'middle','font-family':'Inter',style:'pointer-events:none',
      transform:`rotate(${-angle},${lxOff},${lyOff})`},g).textContent=r.label;

    /* Cardinalities (clickable) */
    const cardOff=14;
    let cfx,cfy,ctx2,cty2,cAnchF,cAnchT;
    if(pf.side==='r'){cfx=x1+cardOff;cfy=y1-7;cAnchF='start';}
    else if(pf.side==='l'){cfx=x1-cardOff;cfy=y1-7;cAnchF='end';}
    else if(pf.side==='b'){cfx=x1+8;cfy=y1+cardOff+4;cAnchF='start';}
    else{cfx=x1+8;cfy=y1-cardOff+2;cAnchF='start';}
    if(pt.side==='r'){ctx2=x2+cardOff;cty2=y2-7;cAnchT='start';}
    else if(pt.side==='l'){ctx2=x2-cardOff;cty2=y2-7;cAnchT='end';}
    else if(pt.side==='b'){ctx2=x2+8;cty2=y2+cardOff+4;cAnchT='start';}
    else{ctx2=x2+8;cty2=y2-cardOff+2;cAnchT='start';}

    const fcEl=el('text',{x:cfx,y:cfy,fill:'#111','font-size':SZ.card,'font-weight':'700',
      'text-anchor':cAnchF,'font-family':'JetBrains Mono',style:'cursor:pointer'},g);
    fcEl.textContent=r.fromCard;
    fcEl.addEventListener('click',e=>{e.stopPropagation();openModal(ri);});

    const tcEl=el('text',{x:ctx2,y:cty2,fill:'#111','font-size':SZ.card,'font-weight':'700',
      'text-anchor':cAnchT,'font-family':'JetBrains Mono',style:'cursor:pointer'},g);
    tcEl.textContent=r.toCard;
    tcEl.addEventListener('click',e=>{e.stopPropagation();openModal(ri);});
  });
}

function render(){
  svg.innerHTML='';
  svg.setAttribute('viewBox',`0 0 ${innerWidth} ${innerHeight}`);
  el('rect',{width:'100%',height:'100%',fill:'#fff'},svg);
  const root=el('g',{transform:`translate(${panX},${panY}) scale(${scale})`},svg);
  tables.forEach(t=>{t.h=tblH(t);tm[t.name]={x:t.x,y:t.y,h:t.h};});
  const ports=computePorts();
  const lineLayer=el('g',{},root);
  drawRels(lineLayer,ports);
  tables.forEach(t=>drawTable(t,root));
}
render();
window.addEventListener('resize',render);

svg.addEventListener('mousedown',e=>{
  if(dragging)return;
  panning=true;panSX=e.clientX-panX;panSY=e.clientY-panY;svg.style.cursor='grabbing';
});
window.addEventListener('mousemove',e=>{
  if(dragging){
    const t=tables.find(t=>t.name===dragging);
    t.x=e.clientX/scale-dragOX-panX/scale;
    t.y=e.clientY/scale-dragOY-panY/scale;
    render();
  } else if(panning){
    panX=e.clientX-panSX;panY=e.clientY-panSY;render();
  }
});
window.addEventListener('mouseup',()=>{dragging=null;panning=false;svg.style.cursor='default';});
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  scale=Math.min(3,Math.max(.25,scale*(e.deltaY>0?.92:1.08)));
  render();
},{passive:false});

/* ── Context Menu (relations) ── */
const ctxMenu=document.getElementById('ctxmenu');
let ctxRi=null;
function showCtxMenu(x,y,ri){
  ctxRi=ri;
  ctxMenu.innerHTML='<div class="danger" id="ctx-delete">✕ Supprimer cette relation</div><div id="ctx-edit">✎ Modifier cardinalités</div>';
  ctxMenu.style.display='block';ctxMenu.style.left=x+'px';ctxMenu.style.top=y+'px';
  document.getElementById('ctx-delete').addEventListener('click',()=>{
    if(ctxRi!==null){rels[ctxRi].hidden=true;hideCtxMenu();render();}
  });
  document.getElementById('ctx-edit').addEventListener('click',()=>{
    if(ctxRi!==null){const ri=ctxRi;hideCtxMenu();openModal(ri);}
  });
}
function hideCtxMenu(){ctxMenu.style.display='none';ctxRi=null;}
function hideAllMenus(){hideCtxMenu();hideTblMenu();}
document.addEventListener('click',hideAllMenus);

/* ── Context Menu (tables) ── */
const tblMenu=document.getElementById('tblmenu');
let tblTarget=null;
function showTblMenu(x,y,name){
  tblTarget=name;
  tblMenu.style.display='block';tblMenu.style.left=x+'px';tblMenu.style.top=y+'px';
}
function hideTblMenu(){tblMenu.style.display='none';tblTarget=null;}
document.getElementById('tbl-delete').addEventListener('click',()=>{
  if(tblTarget){
    const t=tables.find(t=>t.name===tblTarget);
    if(t)t.hidden=true;
    hideTblMenu();render();
  }
});
document.getElementById('tbl-rename').addEventListener('click',()=>{
  if(tblTarget){
    const t=tables.find(t=>t.name===tblTarget);
    if(t){hideTblMenu();editTableName(t);}
  }
});

/* ── Inline editing ── */
function editTableName(t){
  const v=prompt('Nom de la table :',t.name);
  if(v!==null&&v.trim()){
    const old=t.name;
    const n=v.trim();
    t.name=n;
    rels.forEach(r=>{
      if(r.from===old)r.from=n;
      if(r.to===old)r.to=n;
    });
    render();
  }
}
function editColumn(t,i){
  const c=t.cols[i];
  const v=prompt('Nom de la colonne :',c.n);
  if(v!==null&&v.trim()){c.n=v.trim();render();}
}
function editColumnType(t,i){
  const c=t.cols[i];
  const v=prompt('Type de la colonne :',c.t);
  if(v!==null){c.t=v.trim();render();}
}

/* ── Edit Modal ── */
const modalOverlay=document.getElementById('modal-overlay');
const mFrom=document.getElementById('m-from');
const mTo=document.getElementById('m-to');
const mLabel=document.getElementById('m-label');
let modalRi=null;
function openModal(ri){
  modalRi=ri;
  const r=rels[ri];
  mFrom.value=r.fromCard; mTo.value=r.toCard; mLabel.value=r.label;
  modalOverlay.style.display='flex';
}
function closeModal(){modalOverlay.style.display='none';modalRi=null;}
function saveModal(){
  if(modalRi!==null){
    const r=rels[modalRi];
    r.fromCard=mFrom.value; r.toCard=mTo.value; r.label=mLabel.value;
    closeModal(); render();
  }
}
modalOverlay.addEventListener('click',e=>{if(e.target===modalOverlay)closeModal();});

/* ── Export helpers ── */
function exportBBox(){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  activeTables().forEach(t=>{
    minX=Math.min(minX,t.x-40);minY=Math.min(minY,t.y-40);
    maxX=Math.max(maxX,t.x+COL_W+40);maxY=Math.max(maxY,t.y+t.h+40);
  });
  return {minX,minY,w:maxX-minX,h:maxY-minY};
}
function buildExportSVG(){
  const {minX,minY,w,h}=exportBBox();
  const clone=svg.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  clone.setAttribute('width',w*2);clone.setAttribute('height',h*2);
  clone.setAttribute('viewBox',`${minX} ${minY} ${w} ${h}`);
  const rg=clone.querySelector('g');
  if(rg)rg.setAttribute('transform','scale(1)');
  const bg=clone.querySelector('rect');
  if(bg){bg.setAttribute('x',minX);bg.setAttribute('y',minY);bg.setAttribute('width',w);bg.setAttribute('height',h);}
  /* embed fonts via CSS @import */
  const style=document.createElementNS(NS,'style');
  style.textContent=`@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');`;
  clone.insertBefore(style,clone.firstChild);
  return {clone,w,h};
}

/* ── Export SVG ── */
function exportSVG(){
  const {clone}=buildExportSVG();
  const data=new XMLSerializer().serializeToString(clone);
  const blob=new Blob([data],{type:'image/svg+xml;charset=utf-8'});
  const a=document.createElement('a');
  a.download='lartisan_uml.svg';a.href=URL.createObjectURL(blob);a.click();
}

/* ── Export PNG (with fonts) ── */
function exportPNG(){
  const {clone,w,h}=buildExportSVG();
  /* fetch Google Fonts CSS and inline it for proper PNG rendering */
  fetch('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap')
    .then(r=>r.text()).then(css=>{
      /* replace @import with fetched CSS */
      const style=clone.querySelector('style');
      if(style)style.textContent=css;
      const data=new XMLSerializer().serializeToString(clone);
      const blob=new Blob([data],{type:'image/svg+xml;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');c.width=w*2;c.height=h*2;
        const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0);URL.revokeObjectURL(url);
        const a=document.createElement('a');a.download='lartisan_uml.png';a.href=c.toDataURL('image/png');a.click();
      };
      img.src=url;
    }).catch(()=>{
      /* fallback without font embedding */
      const data=new XMLSerializer().serializeToString(clone);
      const blob=new Blob([data],{type:'image/svg+xml;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');c.width=w*2;c.height=h*2;
        const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0);URL.revokeObjectURL(url);
        const a=document.createElement('a');a.download='lartisan_uml.png';a.href=c.toDataURL('image/png');a.click();
      };
      img.src=url;
    });
}
