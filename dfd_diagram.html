<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>L'Artisan — DFD Diagram</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#f9fafb;font-family:'Inter',sans-serif;overflow:hidden;}
  #toolbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px;background:#fff;padding:8px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.08);border:1px solid #e5e7eb;}
  #toolbar button{padding:8px 16px;border:1px solid #d1d5db;border-radius:6px;background:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:#374151;cursor:pointer;transition:all .15s;}
  #toolbar button:hover{background:#f3f4f6;border-color:#9ca3af;}
  #toolbar button.active{background:#6d28d9;color:#fff;border-color:#6d28d9;}
  #toolbar button.danger{color:#dc2626;}
  #toolbar button.danger:hover{background:#fef2f2;border-color:#fca5a5;}
  #title{position:fixed;top:16px;left:16px;z-index:10;font-size:15px;font-weight:700;color:#111;}
  #hint{position:fixed;bottom:12px;left:16px;z-index:10;font-size:11px;color:#6b7280;}
  #canvas{width:100vw;height:100vh;cursor:default;}
  .node text{user-select:none;pointer-events:none;}
  .link path{transition:stroke .2s;}
  .link:hover path.vis{stroke:#6d28d9;}
  
  /* context menu */
  #ctxmenu{display:none;position:fixed;z-index:100;background:#fff;border:1px solid #d1d5db;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:4px 0;font-size:13px;font-family:'Inter',sans-serif;}
  #ctxmenu div{padding:7px 18px;cursor:pointer;color:#111;}
  #ctxmenu div:hover{background:#f3f4f6;}
  #ctxmenu div.danger{color:#dc2626;}
  #ctxmenu div.danger:hover{background:#fef2f2;}
</style>
</head>
<body>
<div id="title">L'Artisan — Diagramme DFD</div>
<div id="toolbar">
  <button onclick="addNode('entity')">+ Entité</button>
  <button onclick="addNode('process')">+ Processus</button>
  <button onclick="addNode('datastore')">+ Stockage</button>
  <div style="width:1px;background:#d1d5db;margin:0 4px;"></div>
  <button id="btn-link" onclick="toggleLinkMode()">🔗 Mode Liaison</button>
  <div style="width:1px;background:#d1d5db;margin:0 4px;"></div>
  <button onclick="exportSVG()">📄 SVG</button>
  <button onclick="exportPNG()">📥 PNG</button>
</div>
<div id="hint">Scroll = zoom · Drag = pan · Drag node = move · Double-click = edit · Right-click = delete</div>
<div id="ctxmenu"><div class="danger" id="ctx-delete">✕ Supprimer</div></div>

<svg id="canvas">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-hover" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/>
    </marker>
  </defs>
</svg>

<script>
const svg=document.getElementById('canvas'),NS='http://www.w3.org/2000/svg';
let panX=0, panY=0, scale=1;
let draggingNode=null, dragOX, dragOY;
let panning=false, panSX, panSY;

let linkMode=false;
let linkSource=null; // ID of the source node

let idCounter=1;

let nodes=[
  {id:'n1', type:'entity', text:'Client', x:150, y:200},
  {id:'n2', type:'process', pid:'1.0', text:'Traiter\nCommande', x:450, y:200},
  {id:'n3', type:'datastore', dsid:'D1', text:'Base Commandes', x:750, y:200}
];

let links=[
  {id:'l1', source:'n1', target:'n2', label:'Nouvelle commande'},
  {id:'l2', source:'n2', target:'n3', label:'Enregistrement'}
];

idCounter = 4; // Next ID to use

function el(tag,attrs,par){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);
  if(par)par.appendChild(e);
  return e;
}

function wrapText(text, x, y, lineH, group) {
  const lines = text.split('\n');
  const startY = y - ((lines.length - 1) * lineH) / 2;
  lines.forEach((line, i) => {
    el('text',{
      x, y: startY + i * lineH,
      fill:'#111', 'font-size':'13', 'text-anchor':'middle', 'dominant-baseline':'central'
    }, group).textContent = line;
  });
}

function getNodePort(node, isSource, otherNode) {
  const dx = otherNode.x - node.x;
  const dy = otherNode.y - node.y;
  
  if (Math.abs(dx) > Math.abs(dy)) {
    // horizontal connection
    let offset = 0;
    if (node.type === 'entity') offset = 80;
    else if (node.type === 'process') offset = 65;
    else if (node.type === 'datastore') offset = 80;
    
    return {x: node.x + (dx > 0 ? offset : -offset), y: node.y};
  } else {
    // vertical connection
    let offset = 0;
    if (node.type === 'entity') offset = 40;
    else if (node.type === 'process') offset = 65;
    else if (node.type === 'datastore') offset = 30;

    return {x: node.x, y: node.y + (dy > 0 ? offset : -offset)};
  }
}

function render(){
  // clear svg except defs
  Array.from(svg.children).forEach(c => {
    if (c.tagName !== 'defs') c.remove();
  });

  el('rect',{width:'100%',height:'100%',fill:'#f9fafb'},svg);
  const root=el('g',{transform:`translate(${panX},${panY}) scale(${scale})`},svg);
  
  const linkLayer = el('g',{},root);
  const nodeLayer = el('g',{},root);

  // Draw links
  links.forEach(l => {
    const sNode = nodes.find(n => n.id === l.source);
    const tNode = nodes.find(n => n.id === l.target);
    if (!sNode || !tNode) return;

    const p1 = getNodePort(sNode, true, tNode);
    const p2 = getNodePort(tNode, false, sNode);

    const g = el('g', {class: 'link'}, linkLayer);
    
    // Calculate path (straight or curved depending on alignment)
    let path;
    const isHorizontal = Math.abs(p2.x - p1.x) > Math.abs(p2.y - p1.y);
    
    if (isHorizontal) {
      path = `M ${p1.x} ${p1.y} C ${p1.x + 50} ${p1.y}, ${p2.x - 50} ${p2.y}, ${p2.x} ${p2.y}`;
    } else {
      path = `M ${p1.x} ${p1.y} C ${p1.x} ${p1.y + 50}, ${p2.x} ${p2.y - 50}, ${p2.x} ${p2.y}`;
    }
    
    // hit area
    el('path',{d:path,fill:'none',stroke:'transparent','stroke-width':15,style:'cursor:pointer'},g);
    // visible line
    const visLine = el('path',{d:path,fill:'none',stroke:'#4b5563','stroke-width':1.5,'marker-end':'url(#arrow)',class:'vis'},g);

    g.addEventListener('mouseenter', () => visLine.setAttribute('marker-end', 'url(#arrow-hover)'));
    g.addEventListener('mouseleave', () => visLine.setAttribute('marker-end', 'url(#arrow)'));
    
    g.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      showCtxMenu(e.clientX, e.clientY, l.id, 'link');
    });

    if (l.label) {
      const mx = (p1.x + p2.x)/2;
      const my = (p1.y + p2.y)/2;
      const bg = el('rect',{x: mx-15, y: my-10, width: 30, height: 20, fill: '#f3f4f6', rx: 4}, g);
      const textEl = el('text',{x: mx, y: my, fill:'#374151', 'font-size':'11', 'font-weight':'600', 'text-anchor':'middle', 'dominant-baseline':'central', style:'cursor:pointer'}, g);
      textEl.textContent = l.label;
      textEl.addEventListener('dblclick', e => {
        e.stopPropagation();
        const v = prompt("Nom du flux de données:", l.label);
        if(v !== null){ l.label = v; render(); }
      });
      // auto adjust bg width
      setTimeout(()=>{
        const bbox = textEl.getBBox();
        bg.setAttribute('width', bbox.width + 12);
        bg.setAttribute('x', mx - (bbox.width + 12)/2);
      }, 0);
    }
  });

  // Draw nodes
  nodes.forEach(n => {
    const g = el('g', {class: 'node', transform: `translate(${n.x},${n.y})`}, nodeLayer);
    
    if (n.id === linkSource) {
      // Highlight if linking
      el('circle', {cx:0, cy:0, r:75, fill:'#ddd6fe'}, g);
    }

    if (n.type === 'entity') {
      const w = 160, h = 80;
      el('rect', {x: -w/2, y: -h/2, width: w, height: h, fill:'#fff', stroke:'#111', 'stroke-width':1.5}, g);
      
      const tEl = el('text', {x: 0, y: 0, fill:'#111', 'font-size':'13', 'font-weight':'600', 'text-anchor':'middle', 'dominant-baseline':'central'}, g);
      tEl.textContent = n.text;

      g.addEventListener('dblclick', e => {
        e.stopPropagation();
        const v = prompt("Nom de l'entité:", n.text);
        if(v !== null){ n.text = v; render(); }
      });

    } else if (n.type === 'process') {
      const r = 65;
      el('circle', {cx: 0, cy: 0, r: r, fill:'#fff', stroke:'#111', 'stroke-width':1.5}, g);
      el('line', {x1: -61, y1: -30, x2: 61, y2: -30, stroke:'#111', 'stroke-width':1.5}, g);
      
      const pidEl = el('text', {x: 0, y: -45, fill:'#111', 'font-size':'12', 'font-weight':'700', 'text-anchor':'middle', 'dominant-baseline':'central'}, g);
      pidEl.textContent = n.pid;

      wrapText(n.text, 0, 10, 16, g);

      g.addEventListener('dblclick', e => {
        e.stopPropagation();
        const v1 = prompt("ID du processus:", n.pid);
        if(v1 !== null) n.pid = v1;
        const v2 = prompt("Nom du processus:", n.text.replace(/\n/g, '\\n'));
        if(v2 !== null) n.text = v2.replace(/\\n/g, '\n');
        if(v1 !== null || v2 !== null) render();
      });

    } else if (n.type === 'datastore') {
      const w = 160, h = 60;
      // Drawing open rectangle (top, bottom, left)
      el('path', {d:`M ${w/2} ${-h/2} L ${-w/2} ${-h/2} L ${-w/2} ${h/2} L ${w/2} ${h/2}`, fill:'#fff', stroke:'#111', 'stroke-width':1.5}, g);
      // Vertical separator
      el('line', {x1: -w/2 + 35, y1: -h/2, x2: -w/2 + 35, y2: h/2, stroke:'#111', 'stroke-width':1.5}, g);
      
      const dsidEl = el('text', {x: -w/2 + 17.5, y: 0, fill:'#111', 'font-size':'12', 'font-weight':'700', 'text-anchor':'middle', 'dominant-baseline':'central'}, g);
      dsidEl.textContent = n.dsid;

      const tEl = el('text', {x: 10, y: 0, fill:'#111', 'font-size':'13', 'text-anchor':'middle', 'dominant-baseline':'central'}, g);
      tEl.textContent = n.text;

      g.addEventListener('dblclick', e => {
        e.stopPropagation();
        const v1 = prompt("ID du stockage:", n.dsid);
        if(v1 !== null) n.dsid = v1;
        const v2 = prompt("Nom du stockage:", n.text);
        if(v2 !== null) n.text = v2;
        if(v1 !== null || v2 !== null) render();
      });
    }

    g.style.cursor = linkMode ? 'crosshair' : 'grab';
    
    g.addEventListener('mousedown', e => {
      e.stopPropagation();
      if (linkMode) {
        if (!linkSource) {
          linkSource = n.id;
          render();
        } else {
          if (linkSource !== n.id) {
            links.push({id: 'l' + idCounter++, source: linkSource, target: n.id, label: 'Flux'});
          }
          linkSource = null;
          toggleLinkMode(); // Turn off link mode after connection
          render();
        }
      } else {
        draggingNode = n.id;
        dragOX = e.clientX/scale - n.x - panX/scale;
        dragOY = e.clientY/scale - n.y - panY/scale;
      }
    });

    g.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      showCtxMenu(e.clientX, e.clientY, n.id, 'node');
    });
  });
}

// ── Interactivity ──

function toggleLinkMode() {
  linkMode = !linkMode;
  document.getElementById('btn-link').classList.toggle('active', linkMode);
  linkSource = null;
  svg.style.cursor = linkMode ? 'crosshair' : 'default';
  render();
}

function addNode(type) {
  // place in center of view
  const cx = (-panX + innerWidth/2) / scale;
  const cy = (-panY + innerHeight/2) / scale;
  
  const id = 'n' + idCounter++;
  if (type === 'entity') nodes.push({id, type, text: 'Nouvelle Entité', x: cx, y: cy});
  else if (type === 'process') nodes.push({id, type, pid: 'X.0', text: 'Nouveau\nProcessus', x: cx, y: cy});
  else if (type === 'datastore') nodes.push({id, type, dsid: 'DX', text: 'Nouveau Stockage', x: cx, y: cy});
  
  render();
}

svg.addEventListener('mousedown',e=>{
  if(linkMode) { linkSource = null; render(); return; }
  if(draggingNode)return;
  panning=true; panSX=e.clientX-panX; panSY=e.clientY-panY; svg.style.cursor='grabbing';
});

window.addEventListener('mousemove',e=>{
  if(draggingNode){
    const n=nodes.find(n=>n.id===draggingNode);
    n.x=e.clientX/scale-dragOX-panX/scale;
    n.y=e.clientY/scale-dragOY-panY/scale;
    render();
  } else if(panning){
    panX=e.clientX-panSX; panY=e.clientY-panSY; render();
  }
});

window.addEventListener('mouseup',()=>{
  draggingNode=null; panning=false; 
  if(!linkMode) svg.style.cursor='default';
});

svg.addEventListener('wheel',e=>{
  e.preventDefault();
  scale=Math.min(3,Math.max(.25,scale*(e.deltaY>0?.92:1.08)));
  render();
},{passive:false});

/* ── Context Menu ── */
const ctxMenu=document.getElementById('ctxmenu');
let ctxTargetId=null, ctxTargetType=null;

function showCtxMenu(x,y,id,type){
  ctxTargetId=id; ctxTargetType=type;
  ctxMenu.style.display='block'; ctxMenu.style.left=x+'px'; ctxMenu.style.top=y+'px';
}
function hideCtxMenu(){ctxMenu.style.display='none'; ctxTargetId=null;}
document.addEventListener('click', hideCtxMenu);

document.getElementById('ctx-delete').addEventListener('click',()=>{
  if(ctxTargetId){
    if(ctxTargetType === 'node') {
      nodes = nodes.filter(n => n.id !== ctxTargetId);
      links = links.filter(l => l.source !== ctxTargetId && l.target !== ctxTargetId);
    } else {
      links = links.filter(l => l.id !== ctxTargetId);
    }
    hideCtxMenu(); render();
  }
});

/* ── Exports ── */
function exportBBox(){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  nodes.forEach(n=>{
    minX=Math.min(minX,n.x-150); minY=Math.min(minY,n.y-100);
    maxX=Math.max(maxX,n.x+150); maxY=Math.max(maxY,n.y+100);
  });
  if(minX===Infinity) return {minX:0, minY:0, w:800, h:600};
  return {minX,minY,w:maxX-minX,h:maxY-minY};
}

function buildExportSVG(){
  const {minX,minY,w,h}=exportBBox();
  const clone=svg.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  clone.setAttribute('width',w*2);clone.setAttribute('height',h*2);
  clone.setAttribute('viewBox',`${minX} ${minY} ${w} ${h}`);
  const rg=clone.querySelector('g');
  if(rg)rg.setAttribute('transform','scale(1)');
  const bg=clone.querySelector('rect');
  if(bg){bg.setAttribute('x',minX);bg.setAttribute('y',minY);bg.setAttribute('width',w);bg.setAttribute('height',h);}
  const style=document.createElementNS(NS,'style');
  style.textContent=`@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');`;
  clone.insertBefore(style,clone.firstChild);
  return {clone,w,h};
}

function exportSVG(){
  const {clone}=buildExportSVG();
  const data=new XMLSerializer().serializeToString(clone);
  const blob=new Blob([data],{type:'image/svg+xml;charset=utf-8'});
  const a=document.createElement('a');
  a.download='lartisan_dfd.svg';a.href=URL.createObjectURL(blob);a.click();
}

function exportPNG(){
  const {clone,w,h}=buildExportSVG();
  fetch('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap')
    .then(r=>r.text()).then(css=>{
      const style=clone.querySelector('style');
      if(style)style.textContent=css;
      const data=new XMLSerializer().serializeToString(clone);
      const blob=new Blob([data],{type:'image/svg+xml;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');c.width=w*2;c.height=h*2;
        const ctx=c.getContext('2d');ctx.fillStyle='#f9fafb';ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0);URL.revokeObjectURL(url);
        const a=document.createElement('a');a.download='lartisan_dfd.png';a.href=c.toDataURL('image/png');a.click();
      };
      img.src=url;
    });
}

// Initial render and resize hook
render();
window.addEventListener('resize',render);

</script>
</body>
</html>
